# Render Blueprint — Render 대시보드에서 "New > Blueprint"로 이 저장소를 고르면 아래 설정으로 백엔드가 만들어져요.
# 비밀 값(sync: false)은 만들 때 Render 화면에서 직접 넣어요.
services:
  - type: web
    name: gacha-showoff-level2-backend
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL
        value: "true"
      - key: CORS_ORIGIN
        sync: false
      - key: NODE_VERSION
        value: "20"
